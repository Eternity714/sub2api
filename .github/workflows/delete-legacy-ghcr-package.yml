name: Delete Legacy GHCR Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-package:
    name: Delete ghcr.io/eternity714/sub2api
    runs-on: ubuntu-latest
    steps:
      - name: Verify token owner and delete the exact legacy package
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          owner="$(gh api user --jq '.login' | tr '[:upper:]' '[:lower:]')"
          test "$owner" = "eternity714"
          gh api --method DELETE \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/sub2api"
          echo "Deleted ghcr.io/eternity714/sub2api"
