services:
  docsify-image-test:
    image: ${DOCSIFY_IMAGE:-sub2api-docsify:local}
    entrypoint: ["/bin/sh", "-c"]
    read_only: true
    cap_drop: [ALL]
    command:
      - |
        set -eu
        seed=/usr/share/nginx/html/docs
        test -d "$$seed"
        for name in index.md _sidebar.md _navbar.md _404.md; do
          test -f "$$seed/$$name" || { printf 'FAIL missing public document: %s\n' "$$name"; exit 1; }
        done
        find "$$seed" -type f -print | sort
        unsafe="$$(find "$$seed" \( -type l -o -name '.*' -o -iname README.md -o \( -type f ! -iname '*.md' ! -iname '*.png' ! -iname '*.jpg' ! -iname '*.jpeg' ! -iname '*.gif' ! -iname '*.ico' ! -iname '*.svg' ! -iname '*.webp' \) \) -print -quit)"
        if [ -n "$$unsafe" ]; then
          printf 'FAIL image exposes maintenance, hidden, linked or unsupported content: %s\n' "$$unsafe"
          exit 1
        fi
        printf 'PASS immutable image contains only public Docsify seed content\n'

  docsify-edge-preview:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    profiles: [docsify-edge]
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./docsify/edge.conf:/source/edge.conf:ro
    command:
      - sh
      - -c
      - |
        set -eu
        sed 's#http://docsify:8080#http://host.docker.internal:18083#g;s#http://sub2api:8080#http://host.docker.internal:18081#g' /source/edge.conf > /etc/nginx/conf.d/default.conf
        nginx -t
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "4", "-O", "/dev/null", "http://127.0.0.1:8080/docs/index.md"]
      interval: 2s
      timeout: 5s
      retries: 10

  docsify-edge-test:
    image: python:3.12-slim
    profiles: [docsify-edge]
    working_dir: /workspace
    environment:
      DOCSIFY_TEST_URL: http://docsify-edge-preview:8080
      DOCSIFY_TEST_CONTENT_DIR: /workspace/frontend/docs
      DOCSIFY_TEST_EDGE: "1"
      DOCSIFY_TEST_MAIN_URL: http://host.docker.internal:18081
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ..:/workspace
    depends_on:
      docsify-edge-preview:
        condition: service_healthy
    command: ["python", "deploy/tests/docsify-http-test.py"]

  docsify-http-test:
    image: python:3.12-slim
    working_dir: /workspace
    environment:
      DOCSIFY_TEST_URL: ${DOCSIFY_TEST_URL:-http://host.docker.internal:18083}
      DOCSIFY_TEST_CONTENT_DIR: /workspace/frontend/docs
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ..:/workspace
    command: ["python", "deploy/tests/docsify-http-test.py"]

  docsify-browser-test:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    working_dir: /workspace
    init: true
    shm_size: 1gb
    environment:
      CI: "true"
      DOCSIFY_TEST_URL: ${DOCSIFY_TEST_URL:-http://host.docker.internal:18083}
      DOCSIFY_TEST_CONTENT_DIR: /workspace/frontend/docs
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ..:/workspace
      - docsify-browser-dependencies:/opt/docsify-browser
      - docsify-browser-npm-cache:/root/.npm
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        npm install --prefix /opt/docsify-browser --no-audit --no-fund --no-package-lock playwright@1.58.2
        node deploy/tests/docsify-browser-test.mjs

  backend-test:
    image: golang:1.27.2
    working_dir: /workspace/backend
    volumes:
      - ../backend:/workspace/backend
      - go-test-build-cache:/root/.cache/go-build
      - go-test-mod-cache:/go/pkg/mod
    command: ["go", "test", "-tags=unit", "./..."]

  backend-integration:
    image: golang:1.27.2
    working_dir: /workspace/backend
    environment:
      CI: "true"
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ../backend:/workspace/backend
      - go-test-build-cache:/root/.cache/go-build
      - go-test-mod-cache:/go/pkg/mod
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        apt-get update
        apt-get install -y --no-install-recommends docker-cli
        go test -tags=integration ./...

  frontend-test:
    image: node:20
    working_dir: /workspace
    environment:
      CI: "true"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    volumes:
      - ..:/workspace
      - frontend-test-node-modules:/workspace/frontend/node_modules
      - frontend-test-pnpm-store:/pnpm/store
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        corepack enable
        corepack prepare pnpm@9.15.9 --activate
        pnpm --dir frontend install --frozen-lockfile --store-dir /pnpm/store
        make test-frontend
        pnpm --dir frontend exec vitest run \
          src/components/account/__tests__/credentialsBuilder.spec.ts \
          src/components/account/__tests__/CreateAccountModal.spec.ts \
          src/components/account/__tests__/EditAccountModal.spec.ts \
          src/components/account/__tests__/AccountPriorityCell.spec.ts \
          src/components/admin/account/__tests__/AccountActionMenu.spark_shadow.spec.ts \
          src/components/common/__tests__/PlatformIcon.media.spec.ts \
          src/views/admin/__tests__/AccountsView.priorityColumn.spec.ts \
          src/components/keys/__tests__/UseKeyModal.spec.ts \
          src/constants/__tests__/platforms.spec.ts \
          src/views/admin/__tests__/platformFilterCatalogUsage.spec.ts \
          src/views/admin/__tests__/channelPlatformOptions.spec.ts \
          src/views/admin/__tests__/GroupsView.compositePlatforms.spec.ts \
          src/views/admin/__tests__/GroupsView.duplicate.spec.ts \
          src/views/admin/__tests__/groupsImagePricing.spec.ts \
          src/components/user/__tests__/UserPlatformQuotaCell.spec.ts \
          src/components/user/dashboard/__tests__/UserDashboardStats.spec.ts \
          src/utils/__tests__/codexCatalogConfig.spec.ts \
          src/utils/__tests__/rechargeBonus.spec.ts \
          src/api/__tests__/payment.spec.ts \
          src/stores/__tests__/payment.config.spec.ts \
          src/views/user/__tests__/paymentUx.spec.ts

volumes:
  docsify-browser-dependencies:
  docsify-browser-npm-cache:
  go-test-build-cache:
  go-test-mod-cache:
  frontend-test-node-modules:
  frontend-test-pnpm-store:
