server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    etag off;
    if_modified_since off;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /docs { return 308 /docs/$is_args$args; }
    location = /docs/batch-image { return 308 /batch-image$is_args$args; }
    location = /docs/batch-image/ { return 308 /batch-image$is_args$args; }

    location = /docs/_assets/config.js {
        alias /opt/docsify/runtime/config.js;
    }
    location = /docs/_assets/style.css {
        alias /opt/docsify/runtime/style.css;
    }
    location /docs/_assets/ {
        alias /opt/docsify/runtime/assets/;
    }

    # Even a mounted source checkout must not publish private or maintenance files.
    location ~ /\. { return 404; }
    location ~* ^/docs/(?:.*/)?README(?:\.md)?/?$ { return 404; }
    location ~ ^/docs/.*\.(?:md|svg|png|jpg|jpeg|webp|gif|ico)$ {
        types {
            text/markdown md;
            image/svg+xml svg;
            image/png png;
            image/jpeg jpg jpeg;
            image/webp webp;
            image/gif gif;
            image/x-icon ico;
        }
        try_files $uri =404;
    }

    # Only real Markdown articles receive the history router shell. Static file
    # misses return 404 rather than successful HTML, including missing JS/CSS.
    location /docs/ {
        if (-f $request_filename.md) { return 418; }
        if (-f $request_filename/index.md) { return 418; }
        return 404;
    }
    # File checks only return an internal status. The shared shell does not
    # change the article URL and does not serve the Markdown as an HTML page.
    error_page 418 = /_docsify_shell;
    location = /_docsify_shell {
        internal;
        alias /opt/docsify/runtime/index.html;
        default_type text/html;
    }
    location / { return 404; }
}
